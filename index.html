<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>E39 Finder</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/storage.js" defer></script>
    <script src="js/evaluation.js" defer></script>
    <script src="js/app.js" defer></script>
  </head>

  <body>
    <header>
      <h1>E39 Finder</h1>
      <p>Find a sensible BMW E39 Touring.</p>
    </header>

    <main>
      <section aria-labelledby="new-listing-heading">
        <h2 id="new-listing-heading">New listing</h2>
        <form id="listing-form">
          <p>
            <label for="model">Model</label>
            <select id="model" name="model" required>
              <option value="">Choose a model</option>
              <option value="520i">520i</option>
              <option value="523i">523i</option>
              <option value="525i">525i</option>
              <option value="528i">528i</option>
              <option value="other">Other E39</option>
            </select>
          </p>
        
          <p>
            <label for="price">Asking price (€)</label>
            <input
              id="price"
              name="price"
              type="number"
              min="0"
              step="1"
              required
            >
          </p>
        
          <p>
            <label for="mileage">Mileage (km, optional)</label>
            <input
              id="mileage"
              name="mileage"
              type="number"
              min="0"
              step="1"
            >
          </p>
          <fieldset>
            <legend>Mandatory vehicle checks</legend>
          
            <p>
              <label for="body-style">Is it an E39 Touring?</label>
              <select id="body-style" name="isE39Touring">
                <option value="unknown">Unknown</option>
                <option value="yes">Yes</option>
                <option value="no">No</option>
              </select>
            </p>
          
            <p>
              <label for="petrol">Is it petrol (Benzin)?</label>
              <select id="petrol" name="isPetrol">
                <option value="unknown">Unknown</option>
                <option value="yes">Yes</option>
                <option value="no">No</option>
              </select>
            </p>
          
            <p>
              <label for="manual">Is it manual (Schaltgetriebe)?</label>
              <select id="manual" name="isManual">
                <option value="unknown">Unknown</option>
                <option value="yes">Yes</option>
                <option value="no">No</option>
              </select>
            </p>
          
            <p>
              <label for="corrosion">Confirmed severe structural corrosion?</label>
              <select id="corrosion" name="severeCorrosion">
                <option value="unknown">Unknown</option>
                <option value="yes">Yes</option>
                <option value="no">No — checked and ruled out</option>
              </select>
            </p>
          
            <p>
              <label for="mechanical-defect">Confirmed major mechanical defect?</label>
              <select id="mechanical-defect" name="majorMechanicalDefect">
                <option value="unknown">Unknown</option>
                <option value="yes">Yes</option>
                <option value="no">No — checked and ruled out</option>
              </select>
            </p>
          </fieldset>
          <button type="submit">Add listing</button>
        </form>
        <p id="listing-summary" role="status"></p>
      </section>

      <section aria-labelledby="saved-listings-heading">
        <h2 id="saved-listings-heading">Saved listings</h2>
        <p id="empty-listings">No listings saved yet.</p>
        <ul id="saved-listings"></ul>
      </section>
    </main>
  </body>
</html>
